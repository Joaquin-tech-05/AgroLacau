<script>
  (function initSplashScreen() {
    const progressBar = document.getElementById('splash-progress-bar');
    const statusText = document.getElementById('splash-status-text');
    
    const steps = [
      { progress: 24, label: "Iniciando terminal de campo..." },
      { progress: 48, label: "Verificando base de datos sin conexión..." },
      { progress: 76, label: "Cargando polígonos de lotes y malezas..." },
      { progress: 95, label: "Sincronizando telemetría de pulverización..." },
      { progress: 100, label: "Listo para ingresar al campo" }
    ];

    let currentStep = 0;

    const interval = setInterval(() => {
      currentStep++;
      if (currentStep < steps.length) {
        if (progressBar) progressBar.style.width = steps[currentStep].progress + '%';
        if (statusText) {
          statusText.style.opacity = '0';
          setTimeout(() => {
            statusText.innerText = steps[currentStep].label;
            statusText.style.opacity = '1';
          }, 150);
        }
      } else {
        clearInterval(interval);
      }
    }, 750);
  })();
